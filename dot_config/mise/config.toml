[tools]
bitwarden = "latest"
chezmoi = "latest"
node = "24"
"npm:@openai/codex" = "latest"
"npm:agent-browser" = "latest"
"npm:opensrc" = "latest"

[tasks."secrets:setup"]
description = "Sync Bitwarden secrets into persistent user environment or private files"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/secrets/setup.mjs"'
raw = true

# Lightpanda container runtime: WSLC on Windows, Docker on Linux.
[tasks."lightpanda:start"]
description = "Start Lightpanda via WSLC (Windows) or Docker (Linux) (localhost:9222)"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/lightpanda/manage.mjs" start'

[tasks."lightpanda:stop"]
description = "Stop the Lightpanda container"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/lightpanda/manage.mjs" stop'

[tasks."lightpanda:status"]
description = "Inspect the Lightpanda container"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/lightpanda/manage.mjs" status'

[tasks."lightpanda:update"]
description = "Pull Lightpanda nightly and recreate its container"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/lightpanda/manage.mjs" update'

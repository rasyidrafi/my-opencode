[settings]
minimum_release_age = "0s"

[tools]
agy = "1.4.5"
azure = "2.91.0"
bitwarden = "2026.10.0"
bun = "1.4.4"
chezmoi = "2.73.3"
cloudflared = "2026.10.3"
ffmpeg = "9.0.2"
gcloud = "590.0.0"
gh = "2.103.0"
kubectl = "1.37.1"
mysql-client = "9.7.1"
node = "24"
opencode = { version = "2.1.3", allow_builds = ["@opencode/cli"] }
yarn = "4.18.1"
"github:iOfficeAI/OfficeCLI" = "1.0.158"
"npm:@openai/codex" = "0.163.0"
"npm:@openchamber/web" = "2.5.1"
"npm:opensrc" = "0.7.3"
"npm:playwriter" = "0.9.0"

[tasks."secrets:setup"]
description = "Sync Bitwarden secrets into persistent user environment or private files"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/secrets/setup.mjs"'
raw = true

[tasks."shell:setup"]
description = "Install deterministic Bash environment hooks, preserving user customizations"
run = 'node "{{ env.HOME }}/.config/shell/setup.mjs"'
raw = true

[tasks."skills:install"]
description = "Interactively link optional skills globally or into a project"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/skills/setup.mjs" install'
raw = true

[tasks."skills:list"]
description = "List available optional skills"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/skills/setup.mjs" list'
raw = true

[tasks."rawroute:local"]
description = "Opt into local Rawroute for Codex and OpenCode on this machine"
run = 'node "{{ env.HOME }}/.config/rawroute/setup.mjs" local'
raw = true

[tasks."rawroute:default"]
description = "Restore the default Rawroute endpoint for Codex and OpenCode"
run = 'node "{{ env.HOME }}/.config/rawroute/setup.mjs" default'
raw = true

[tasks."chrome:setup"]
description = "Opt in to installing Google Chrome Stable (Linux Debian/Ubuntu amd64 only)"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/chrome/setup.mjs"'
raw = true

[tasks."docker:setup"]
description = "Set up native Docker on a host, or native clients with a guest SSH context"
run = 'node "{{ env.HOME }}/.config/docker-setup/setup.mjs"'
raw = true

[tasks."azure-mnt-cache:setup"]
description = "Move host Docker storage to /mnt and install shell cache paths; SSH guests keep using their host"
run = 'node "{{ env.HOME }}/.config/azure-mnt-cache/setup.mjs"'
raw = true

[tasks."tailscale:setup"]
description = "Connect Tailscale to qilin-elver.ts.net, preserving other saved accounts"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/tailscale/setup.mjs"'
raw = true

[tasks."openchamber:setup"]
description = "Replace OpenChamber on port 3000 with its native user startup service"
run = [
  "openchamber startup disable",
  "openchamber stop --port 3000",
  "openchamber startup enable --port 3000",
]
raw = true

[tools]
agy = "latest"
azure = "latest"
bitwarden = "latest"
bun = "latest"
chezmoi = "latest"
cloudflared = "latest"
ffmpeg = "latest"
gcloud = "latest"
gh = "latest"
kubectl = "latest"
mysql-client = "latest"
node = "24"
opencode = "latest"
yarn = "latest"
"github:iOfficeAI/OfficeCLI" = "latest"
"npm:@openai/codex" = "latest"
"npm:@openchamber/web" = "latest"
"npm:opensrc" = "latest"
"npm:playwriter" = "latest"

[tasks."secrets:setup"]
description = "Sync Bitwarden secrets into persistent user environment or private files"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/secrets/setup.mjs"'
raw = true

[tasks."tailscale:setup"]
description = "Connect Tailscale to qilin-elver.ts.net, preserving other saved accounts"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/tailscale/setup.mjs"'
raw = true

[tasks."openchamber:setup"]
description = "Replace OpenChamber on port 3000 with its native user startup service"
run = [
  "openchamber startup disable",
  "openchamber stop --port 3000",
  "openchamber startup enable --port 3000",
]
raw = true

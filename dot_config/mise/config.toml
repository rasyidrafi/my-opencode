[settings]
minimum_release_age = "0s"

[plugins]
# Override the embedded gcloud plugin missing lib/python.lua in mise 2026.10.21.
"vfox:gcloud" = "https://github.com/jdx/vfox-gcloud#8bc2e33aa741c0935f219e0d5791f0dc92569ed9"

[tools]
agy = "1.4.9"
azure = "2.91.0"
bitwarden = "2026.10.0"
bun = "1.4.4"
chezmoi = "2.73.3"
cloudflared = "2026.10.5"
ffmpeg = "9.0.2"
gcloud = "591.0.0"
gh = "2.103.3"
kubectl = "1.37.2"
mysql-client = "9.7.4"
node = "26.13.0"
opencode = { version = "2.2.0", allow_builds = ["@opencode/cli"], allow_low_downloads = true }
yarn = "4.18.1"
"github:iOfficeAI/OfficeCLI" = "1.0.159"
"npm:@openai/codex" = "0.165.0"
"npm:@openchamber/web" = "2.5.3"
"npm:opensrc" = "0.7.3"
"npm:playwriter" = "0.9.0"

[tasks."cloudflared:restart"]
description = "Switch the running cloudflared service to the global Mise version and restart"
run = 'node "{{ env.HOME }}/.config/cloudflared/restart.mjs"'
raw = true

[tasks."cloudflared:setup"]
description = "Integrate an existing cloudflared service with global Mise using a systemd drop-in"
run = 'node "{{ env.HOME }}/.config/cloudflared/setup.mjs"'
raw = true

[tasks."tools:cleanup"]
description = "Preview or safely remove unused older mise tool versions (Linux)"
run = 'node "{{ env.HOME }}/.config/tools-cleanup/setup.mjs"'
raw = true

[tasks."secrets:setup"]
description = "Sync Bitwarden secrets into persistent user environment or private files"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/secrets/setup.mjs"'
raw = true

[tasks."github:setup"]
description = "Configure GitHub HTTPS credentials through the stable Mise gh shim"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/github/setup.mjs"'
raw = true

[tasks."shell:setup"]
description = "Install deterministic Bash environment hooks, preserving user customizations"
run = 'node "{{ env.HOME }}/.config/shell/setup.mjs"'
raw = true

[tasks."skills:install"]
description = "Interactively link optional skills globally or into a project"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/skills/setup.mjs" install'
raw = true

[tasks."skills:list"]
description = "List available optional skills"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/skills/setup.mjs" list'
raw = true

[tasks."provider:local"]
description = "Opt into local Rawroute for Codex and OpenCode on this machine"
run = 'node "{{ env.HOME }}/.config/rawroute/setup.mjs" local'
raw = true

[tasks."provider:default"]
description = "Restore the default Rawroute endpoint for Codex and OpenCode"
run = 'node "{{ env.HOME }}/.config/rawroute/setup.mjs" default'
raw = true

[tasks."rawroute:default"]
description = "Use the public Rawroute provider endpoint in OpenCode"
run = 'node "{{ env.HOME }}/.config/rawroute/setup.mjs" default --rawroute'
raw = true

[tasks."rawroute:local"]
description = "Use the local Rawroute provider endpoint in OpenCode"
run = 'node "{{ env.HOME }}/.config/rawroute/setup.mjs" local --rawroute'
raw = true

[tasks."chrome:setup"]
description = "Opt in to installing Google Chrome Stable (Linux Debian/Ubuntu amd64 only)"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/chrome/setup.mjs"'
raw = true

[tasks."docker:setup"]
description = "Set up native Docker on a host, or native clients with a guest SSH context"
run = 'node "{{ env.HOME }}/.config/docker-setup/setup.mjs"'
raw = true

[tasks."docker:forward:setup"]
description = "Mirror remote Docker published TCP ports to guest localhost with a persistent systemd service"
run = 'node "{{ env.HOME }}/.config/docker-forward/setup.mjs"'
raw = true

[tasks."azure-mnt-cache:setup"]
description = "Move host Docker storage to /mnt and install shell cache paths; SSH guests keep using their host"
run = 'node "{{ env.HOME }}/.config/azure-mnt-cache/setup.mjs"'
raw = true

[tasks."tailscale:setup"]
description = "Connect Tailscale to qilin-elver.ts.net, preserving other saved accounts"
run = 'node "{% if os() == "windows" %}{{ env.USERPROFILE }}{% else %}{{ env.HOME }}{% endif %}/.config/tailscale/setup.mjs"'
raw = true

[tasks."codex:setup"]
description = "Start the Codex app-server daemon, or restart it if already running"
run = "codex app-server daemon restart"
raw = true

[tasks."openchamber:setup"]
description = "Replace OpenChamber on port 3000 with its native user startup service"
run = [
  "openchamber startup disable",
  "openchamber stop --port 3000",
  "openchamber startup enable --port 3000",
]
raw = true
